<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a101d">
  <title>Forge CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">F</span><span>Forge CRM</span></div>
      <div class="topbar-copy">Sales workspace</div>
      <button id="resetView" class="reset-view" type="button">Reset view</button>
    </header>
    <div id="workspaceViewport" class="workspace-viewport" aria-label="CRM workspace. Swipe left or right to view all panels; pinch to zoom.">
      <div class="workspace">
        <aside class="sidebar">
          <div class="sidebar-title">Pipeline</div>
          <button class="nav-item active" type="button">Leads <span>24</span></button>
          <button class="nav-item" type="button">Inbox <span>8</span></button>
          <button class="nav-item" type="button">Tasks <span>5</span></button>
          <button class="nav-item" type="button">Reports</button>
          <div class="sidebar-foot">Swipe the workspace horizontally on mobile to reach every panel.</div>
        </aside>
        <section class="lead-panel panel" aria-label="Leads">
          <div class="panel-head">
            <div><p class="eyebrow">Pipeline</p><h1>Leads</h1></div>
            <button class="round-button" type="button" aria-label="Add lead">+</button>
          </div>
          <label class="search"><span>⌕</span><input id="leadSearch" type="search" placeholder="Search leads"></label>
          <div id="leadList" class="lead-list"></div>
        </section>
        <section id="detailPanel" class="detail-panel panel" aria-live="polite"></section>
        <aside id="activityPanel" class="activity-panel panel" aria-live="polite"></aside>
      </div>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
